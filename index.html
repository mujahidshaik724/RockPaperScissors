<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Rock Paper Scissor</title>
  </head>
  <body>
    <script src="script.js" defer></script>
    <div class="flex-container">
      <button class="button-img" id="rock">
        <img src="assets/rock.jpg" alt="Rock" />
      </button>
      <button class="button-img" id="paper">
        <img src="assets/paper.jpg" alt="Paper" />
      </button>
      <button class="button-img" id="scissor">
        <img src="assets/scissor.jpg" alt="Scissor" />
      </button>
    </div>
    <div class="scores">
      <p id="user-score">Your Score: 0</p>
      <p id="computer-score">Computer Score: 0</p>
      <p id="tie-score">Tie: 0</p>
    </div>
    <div class="winner-message" id="winner-message"></div>
    <button class="reset-button" id="reset-button">Reset Game</button>
  </body>
</html>
